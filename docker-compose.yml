services:
  db:
    image: postgis/postgis:16-3.4
    container_name: worldview-db
    environment:
      POSTGRES_DB: worldview
      POSTGRES_USER: worldview
      POSTGRES_PASSWORD: worldview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldview -d worldview"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: worldview-backend
    environment:
      ENVIRONMENT: docker
      CORS_ORIGINS: http://localhost:5173
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: worldview
      DB_USER: worldview
      DB_PASSWORD: worldview
      USGS_FEED_URL: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson
      INGEST_INTERVAL_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
